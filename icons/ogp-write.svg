<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5c8"/>
      <stop offset="100%" stop-color="#00ffdc"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5c8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00e5c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="360" cy="315" rx="500" ry="380" fill="url(#glow)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#ag)"/>

  <!-- Manuscript lines -->
  <line x1="88" y1="210" x2="860" y2="210" stroke="#00e5c8" stroke-width="0.5" stroke-opacity="0.1"/>
  <line x1="88" y1="250" x2="860" y2="250" stroke="#00e5c8" stroke-width="0.5" stroke-opacity="0.07"/>
  <line x1="88" y1="490" x2="860" y2="490" stroke="#00e5c8" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="88" y1="530" x2="860" y2="530" stroke="#00e5c8" stroke-width="0.5" stroke-opacity="0.05"/>

  <!-- Left vertical accent -->
  <line x1="88" y1="88" x2="88" y2="542" stroke="#00e5c8" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="88" cy="88" r="5" fill="#00e5c8" opacity="0.4"/>
  <circle cx="88" cy="542" r="3" fill="#00e5c8" opacity="0.15"/>

  <!-- App name shadow -->
  <text x="126" y="275" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="82" fill="#00e5c8" opacity="0.07">MARGINALIA</text>
  <!-- App name main -->
  <text x="126" y="271" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="78" fill="#00e5c8">MARGINALIA</text>

  <!-- Label -->
  <text x="130" y="326" font-family="'Courier New',monospace" font-size="16" fill="#1e5060" letter-spacing="0.26em">MEMO &amp; TODO MANAGER</text>

  <!-- Divider -->
  <line x1="130" y1="358" x2="780" y2="358" stroke="#00e5c8" stroke-width="1" stroke-opacity="0.18"/>

  <!-- Description -->
  <text x="130" y="408" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="30" fill="#6ab8b8">メモ・ToDoをひとつに。カレンダー連携・XP成長システム付き。</text>

  <!-- Feature chips -->
  <rect x="130" y="445" width="82" height="32" rx="4" fill="none" stroke="#00e5c8" stroke-width="1" stroke-opacity="0.5"/>
  <text x="171" y="467" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#00e5c8" font-weight="600">無料</text>
  <rect x="226" y="445" width="130" height="32" rx="4" fill="none" stroke="#00e5c8" stroke-width="1" stroke-opacity="0.2"/>
  <text x="291" y="467" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2a6870">カレンダー表示</text>
  <rect x="370" y="445" width="100" height="32" rx="4" fill="none" stroke="#00e5c8" stroke-width="1" stroke-opacity="0.2"/>
  <text x="420" y="467" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2a6870">色分けタグ</text>
  <rect x="484" y="445" width="100" height="32" rx="4" fill="none" stroke="#00e5c8" stroke-width="1" stroke-opacity="0.2"/>
  <text x="534" y="467" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2a6870">SNS共有</text>

  <!-- Somirai Lab -->
  <text x="1100" y="600" text-anchor="end" font-family="'Helvetica Neue','Arial',sans-serif" font-size="15" fill="#1c3840" letter-spacing="0.12em">Somirai Lab</text>
</svg>
