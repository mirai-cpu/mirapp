<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="rgba(232,196,104,0.07)" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8c468"/>
      <stop offset="100%" stop-color="#c9a13f"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e8c468" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e8c468" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#070810"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="420" cy="315" rx="480" ry="350" fill="url(#glow)"/>

  <rect x="0" y="0" width="1200" height="4" fill="url(#ag)"/>
  <rect x="0" y="626" width="1200" height="4" fill="#e8c468" opacity="0.2"/>
  <rect x="88" y="80" width="3" height="470" fill="url(#ag)"/>

  <text x="132" y="248" font-family="Impact,'Arial Black',sans-serif" font-size="76" font-weight="900" fill="#e8c468" opacity="0.12" letter-spacing="0.02em">MY PLAYER</text>
  <text x="130" y="245" font-family="Impact,'Arial Black',sans-serif" font-size="76" font-weight="900" fill="#e8c468" letter-spacing="0.02em">MY PLAYER</text>

  <text x="130" y="300" font-family="'Courier New',monospace" font-size="18" fill="#a8adc4" letter-spacing="0.28em">SOMIRAI LAB CROSS-TOOL RPG</text>

  <line x1="130" y1="330" x2="780" y2="330" stroke="#e8c468" stroke-width="1" stroke-opacity="0.3"/>

  <text x="130" y="380" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="30" fill="#eaecf4">全ツールの利用状況が、1人の選手ステータスになる。</text>
  <text x="130" y="420" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="24" fill="#a8adc4">TEMPER・MARGINALIA・KURA・LUMBER・TACTICIAN</text>

  <rect x="130" y="460" width="82" height="32" rx="4" fill="none" stroke="#e8c468" stroke-width="1" stroke-opacity="0.6"/>
  <text x="171" y="482" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e8c468" font-weight="600">無料</text>

  <rect x="226" y="460" width="140" height="32" rx="4" fill="none" stroke="#e8c468" stroke-width="1" stroke-opacity="0.35"/>
  <text x="296" y="482" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8a92c0">連続来訪ストリーク</text>

  <rect x="380" y="460" width="150" height="32" rx="4" fill="none" stroke="#e8c468" stroke-width="1" stroke-opacity="0.35"/>
  <text x="455" y="482" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8a92c0">レーダーチャート</text>

  <text x="1100" y="600" text-anchor="end" font-family="'Helvetica Neue','Arial',sans-serif" font-size="15" fill="#3a3428" letter-spacing="0.12em">Somirai Lab</text>

  <!-- Right: radar pentagon -->
  <g transform="translate(880, 145)" opacity="0.9">
    <polygon points="170,0 320,86 262,268 78,268 20,86" fill="none" stroke="#e8c468" stroke-width="2" opacity="0.35"/>
    <polygon points="170,50 275,112 235,236 105,236 65,112" fill="none" stroke="#e8c468" stroke-width="2" opacity="0.3"/>
    <polygon points="170,110 210,140 195,196 145,196 130,140" fill="none" stroke="#e8c468" stroke-width="2" opacity="0.25"/>
    <polygon points="170,20 300,96 250,220 100,214 55,100" fill="#e8c468" opacity="0.22" stroke="#f3dca0" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="170" cy="20" r="7" fill="#f3dca0"/>
    <circle cx="300" cy="96" r="7" fill="#f3dca0"/>
    <circle cx="250" cy="220" r="7" fill="#f3dca0"/>
    <circle cx="100" cy="214" r="7" fill="#f3dca0"/>
    <circle cx="55" cy="100" r="7" fill="#f3dca0"/>
  </g>
