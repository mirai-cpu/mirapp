<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0L0 0 0 44" fill="none" stroke="rgba(0,230,118,0.05)" stroke-width="0.6"/>
    </pattern>
    <pattern id="minigrid" width="8.8" height="8.8" patternUnits="userSpaceOnUse">
      <path d="M8.8 0L0 0 0 8.8" fill="none" stroke="rgba(0,230,118,0.025)" stroke-width="0.4"/>
    </pattern>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#64ffda"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#020805"/>
  <rect width="1200" height="630" fill="url(#minigrid)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="350" cy="315" rx="480" ry="360" fill="url(#glow)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#ag)"/>
  <rect x="0" y="627" width="1200" height="3" fill="#00e676" opacity="0.1"/>

  <!-- Left vertical accent -->
  <rect x="88" y="80" width="2" height="470" fill="url(#ag)"/>

  <!-- App name shadow -->
  <text x="130" y="260" font-family="'Courier New','Lucida Console',monospace" font-size="128" font-weight="900" fill="#00e676" opacity="0.07" letter-spacing="0.06em">TACTICIAN</text>
  <!-- App name main -->
  <text x="130" y="255" font-family="'Courier New','Lucida Console',monospace" font-size="110" font-weight="900" fill="#00e676" letter-spacing="0.04em" text-shadow="0 0 20px #00e676">TACTICIAN</text>

  <!-- Category label -->
  <text x="130" y="300" font-family="'Courier New',monospace" font-size="15" fill="#1d4d30" letter-spacing="0.28em">BASEBALL ORDER MAKER</text>

  <!-- Divider -->
  <line x1="130" y1="330" x2="830" y2="330" stroke="#00e676" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Lineup display (terminal style) -->
  <text x="130" y="372" font-family="'Courier New',monospace" font-size="17" fill="#2d7a4a" letter-spacing="0.08em">1. [CF] ——————  8</text>
  <text x="130" y="394" font-family="'Courier New',monospace" font-size="17" fill="#2d7a4a" letter-spacing="0.08em">2. [SS] ——————  6</text>
  <text x="130" y="416" font-family="'Courier New',monospace" font-size="17" fill="#00e676" letter-spacing="0.08em">3. [1B] ——————  3    ← ANCHOR</text>
  <text x="130" y="438" font-family="'Courier New',monospace" font-size="17" fill="#2d7a4a" letter-spacing="0.08em">4. [DH] ——————  0</text>

  <!-- Feature chips -->
  <rect x="130" y="464" width="82" height="32" rx="4" fill="none" stroke="#00e676" stroke-width="1" stroke-opacity="0.5"/>
  <text x="171" y="486" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#00e676" font-weight="600">無料</text>
  <rect x="226" y="464" width="120" height="32" rx="4" fill="none" stroke="#00e676" stroke-width="1" stroke-opacity="0.2"/>
  <text x="286" y="486" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e5a30">打順・守備配置</text>
  <rect x="360" y="464" width="100" height="32" rx="4" fill="none" stroke="#00e676" stroke-width="1" stroke-opacity="0.2"/>
  <text x="410" y="486" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e5a30">DH制対応</text>
  <rect x="474" y="464" width="130" height="32" rx="4" fill="none" stroke="#00e676" stroke-width="1" stroke-opacity="0.2"/>
  <text x="539" y="486" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e5a30">印刷・シェア</text>

  <!-- Somirai Lab -->
  <text x="1100" y="600" text-anchor="end" font-family="'Helvetica Neue','Arial',sans-serif" font-size="15" fill="#0e2a18" letter-spacing="0.12em">Somirai Lab</text>

  <!-- Right decorative: baseball diamond -->
  <g transform="translate(1010, 160)" opacity="0.18">
    <polygon points="100,10 190,100 100,190 10,100" fill="none" stroke="#00e676" stroke-width="1.5"/>
    <line x1="100" y1="10" x2="100" y2="190" stroke="#00e676" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="10" y1="100" x2="190" y2="100" stroke="#00e676" stroke-width="0.5" stroke-opacity="0.4"/>
    <circle cx="100" cy="10" r="5" fill="none" stroke="#00e676" stroke-width="1.5"/>
    <circle cx="190" cy="100" r="5" fill="none" stroke="#00e676" stroke-width="1.5"/>
    <circle cx="100" cy="190" r="7" fill="#00e676" opacity="0.6"/>
    <circle cx="10" cy="100" r="5" fill="none" stroke="#00e676" stroke-width="1.5"/>
    <text x="100" y="215" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#2d7a4a" letter-spacing="0.1em">HOME</text>
  </g>
</svg>
