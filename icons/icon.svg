<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="ray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <rect width="512" height="512" rx="112" fill="none" stroke="#ffffff" stroke-width="0" opacity="0"/>

  <!-- Horizon arc — stylized sunrise -->
  <path d="M 96 320 A 160 160 0 0 1 416 320" fill="none" stroke="url(#arc)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

  <!-- Sun rays -->
  <line x1="256" y1="320" x2="256" y2="130" stroke="url(#ray)" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="320" x2="174" y2="148" stroke="url(#ray)" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="320" x2="338" y2="148" stroke="url(#ray)" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="320" x2="112" y2="200" stroke="url(#ray)" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="256" y1="320" x2="400" y2="200" stroke="url(#ray)" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Sun center glow circle -->
  <circle cx="256" cy="320" r="22" fill="#f97316" opacity="0.9"/>
  <circle cx="256" cy="320" r="14" fill="#fbbf24"/>

  <!-- Wordmark "S" letterform hint -->
  <text x="256" y="438" text-anchor="middle" font-family="'Helvetica Neue','Arial',sans-serif" font-size="52" font-weight="800" fill="#334155" letter-spacing="0.15em">SOMIRAI</text>
</svg>
