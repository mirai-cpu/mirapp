<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7bb8ff"/>
      <stop offset="100%" stop-color="#4f9eff"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f9eff"/>
      <stop offset="100%" stop-color="#4f9eff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f9eff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4f9eff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- 右サイドの装飾グリッド -->
  <g stroke="#1e3355" stroke-width="1" opacity="0.5">
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="700" y1="105" x2="1200" y2="105"/>
    <line x1="700" y1="210" x2="1200" y2="210"/>
    <line x1="700" y1="315" x2="1200" y2="315"/>
    <line x1="700" y1="420" x2="1200" y2="420"/>
    <line x1="700" y1="525" x2="1200" y2="525"/>
  </g>

  <!-- グリッドのグラデーションマスク -->
  <rect x="700" y="0" width="500" height="630" fill="url(#bgGrad)" opacity="0.3"/>

  <!-- 左背景グロー -->
  <ellipse cx="310" cy="315" rx="220" ry="230" fill="url(#glowGrad)"/>

  <!-- ===== 左ゾーン: アイコン ===== -->
  <!-- アイコン背景 -->
  <rect x="80" y="155" width="200" height="200" fill="#111c30" rx="38" stroke="#1e3355" stroke-width="1.5"/>

  <!-- アイコン内グロー -->
  <ellipse cx="180" cy="255" rx="75" ry="80" fill="url(#glowGrad)"/>

  <!-- アイコン稲妻（グロー） -->
  <path d="M 208 178 L 148 258 L 183 258 L 143 335 L 215 245 L 179 245 Z"
        fill="#4f9eff" opacity="0.3" filter="url(#glow)"/>

  <!-- アイコン稲妻本体 -->
  <path d="M 208 178 L 148 258 L 183 258 L 143 335 L 215 245 L 179 245 Z"
        fill="url(#boltGrad)" filter="url(#softGlow)"/>

  <!-- アイコン稲妻ハイライト -->
  <path d="M 208 178 L 183 218 L 200 218 L 208 178 Z"
        fill="white" fill-opacity="0.25"/>

  <!-- ===== 中央〜右ゾーン: テキスト ===== -->

  <!-- サイト名 -->
  <text x="330" y="270"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="82"
        font-weight="700"
        letter-spacing="-1"
        fill="#dce8f5">Somira</text>

  <text x="330" y="355"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="82"
        font-weight="700"
        letter-spacing="-1"
        fill="#4f9eff">Lab</text>

  <!-- アクセントライン -->
  <rect x="330" y="372" width="340" height="3" fill="url(#accentLine)" rx="2"/>

  <!-- タグライン -->
  <text x="330" y="418"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="22"
        fill="#5a7a9f"
        letter-spacing="0.5">使いやすいWebツールの集積地</text>

  <!-- URL -->
  <text x="330" y="468"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="20"
        fill="#4f9eff"
        fill-opacity="0.8"
        letter-spacing="0.5">somirai.jp</text>

  <!-- 右側の装飾バッジ群 -->
  <rect x="820" y="180" width="160" height="44" fill="#152036" rx="22" stroke="#1e3355" stroke-width="1"/>
  <text x="900" y="207" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="17" fill="#5a7a9f">野球成績管理</text>

  <rect x="1000" y="230" width="140" height="44" fill="#152036" rx="22" stroke="#1e3355" stroke-width="1"/>
  <text x="1070" y="257" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="17" fill="#5a7a9f">習慣トラッカー</text>

  <rect x="850" y="290" width="120" height="44" fill="#152036" rx="22" stroke="#4f9eff" stroke-width="1.5"/>
  <text x="910" y="317" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="17" fill="#4f9eff">無料で使える</text>

  <rect x="990" y="350" width="100" height="44" fill="#152036" rx="22" stroke="#1e3355" stroke-width="1"/>
  <text x="1040" y="377" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="17" fill="#5a7a9f">PWA対応</text>

  <rect x="820" y="410" width="130" height="44" fill="#152036" rx="22" stroke="#1e3355" stroke-width="1"/>
  <text x="885" y="437" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="17" fill="#5a7a9f">広告なし</text>

  <!-- 右上の輝き -->
  <circle cx="1160" cy="80" r="5" fill="#7bb8ff" fill-opacity="0.6"/>
  <circle cx="1145" cy="62" r="3" fill="#7bb8ff" fill-opacity="0.4"/>
  <circle cx="1172" cy="98" r="2.5" fill="#4f9eff" fill-opacity="0.4"/>
</svg>
