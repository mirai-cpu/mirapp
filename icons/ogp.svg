<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="spG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="coG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="obG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="lineF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowR" cx="25%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgG)"/>
  <ellipse cx="300" cy="315" rx="350" ry="300" fill="url(#glowR)"/>

  <!-- Grid decoration -->
  <g stroke="#fb923c" stroke-width="0.6" opacity="0.06">
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="700" y1="105" x2="1200" y2="105"/>
    <line x1="700" y1="210" x2="1200" y2="210"/>
    <line x1="700" y1="315" x2="1200" y2="315"/>
    <line x1="700" y1="420" x2="1200" y2="420"/>
    <line x1="700" y1="525" x2="1200" y2="525"/>
  </g>

  <!-- Icon -->
  <rect x="80" y="165" width="180" height="180" fill="#0f172a" rx="36" stroke="#2a1a10" stroke-width="1.5"/>
  <g transform="translate(170, 255)">
    <ellipse cx="0" cy="0" rx="55" ry="55" fill="none" stroke="url(#obG)" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 6"/>
    <path d="M0 -40 C14 -20, 30 -10, 12 14 C5 26, -5 26, -12 14 C-30 -10, -14 -20, 0 -40Z" fill="url(#spG)" opacity="0.18"/>
    <circle cx="0" cy="-4" r="18" fill="url(#coG)"/>
    <circle cx="-3" cy="-10" r="6" fill="#fff" opacity="0.25"/>
    <path d="M0 -30 L3 -10 L0 -4 L-3 -10 Z" fill="#fb923c" opacity="0.9"/>
    <path d="M-22 -4 L-6 -2 L0 -4 L-6 -6 Z" fill="#fbbf24" opacity="0.7"/>
    <path d="M22 -4 L6 -2 L0 -4 L6 -6 Z" fill="#fbbf24" opacity="0.7"/>
    <circle cx="36" cy="-30" r="5" fill="#fb923c" opacity="0.65"/>
    <circle cx="-30" cy="26" r="4" fill="#fbbf24" opacity="0.5"/>
    <circle cx="40" cy="18" r="3.5" fill="#6ee7b7" opacity="0.45"/>
  </g>

  <!-- Site name -->
  <text x="310" y="280" font-family="'DM Sans','Helvetica Neue',sans-serif" font-size="82" font-weight="800" letter-spacing="-2" fill="#f1f5f9">Somi<tspan fill="url(#coG)">rai</tspan></text>
  <text x="310" y="360" font-family="'DM Sans','Helvetica Neue',sans-serif" font-size="82" font-weight="800" letter-spacing="-2" fill="url(#obG)">Lab</text>

  <rect x="310" y="378" width="380" height="2.5" fill="url(#lineF)" rx="2"/>

  <text x="312" y="420" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="22" fill="#94a3b8" letter-spacing="1">未来をかたちにする、Webツール集</text>
  <text x="312" y="460" font-family="'DM Sans','Helvetica Neue',sans-serif" font-size="20" fill="#fb923c" fill-opacity="0.7" letter-spacing="0.5">somirai.jp</text>

  <!-- Tool badges -->
  <rect x="820" y="180" width="160" height="44" fill="#1a1220" rx="22" stroke="#2a1a10" stroke-width="1"/>
  <text x="900" y="207" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fb923c">野球成績管理</text>

  <rect x="1000" y="230" width="140" height="44" fill="#1a1220" rx="22" stroke="#2a1a10" stroke-width="1"/>
  <text x="1070" y="257" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fbbf24">習慣トラッカー</text>

  <rect x="850" y="290" width="120" height="44" fill="#1a1220" rx="22" stroke="#fb923c" stroke-width="1.5"/>
  <text x="910" y="317" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fb923c" font-weight="600">無料で使える</text>

  <rect x="990" y="350" width="100" height="44" fill="#1a1220" rx="22" stroke="#2a1a10" stroke-width="1"/>
  <text x="1040" y="377" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6ee7b7">PWA対応</text>

  <rect x="820" y="410" width="130" height="44" fill="#1a1220" rx="22" stroke="#2a1a10" stroke-width="1"/>
  <text x="885" y="437" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#94a3b8">広告なし</text>

  <!-- Top/bottom accent -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#obG)"/>
  <rect x="0" y="627" width="1200" height="3" fill="url(#obG)" opacity="0.5"/>
</svg>
