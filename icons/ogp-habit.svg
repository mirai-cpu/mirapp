<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="rgba(255,69,0,0.07)" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="420" cy="315" rx="480" ry="350" fill="url(#glow)"/>

  <!-- Top + bottom accent bars -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#ag)"/>
  <rect x="0" y="626" width="1200" height="4" fill="#ff4500" opacity="0.2"/>

  <!-- Left vertical accent -->
  <rect x="88" y="80" width="3" height="470" fill="url(#ag)"/>

  <!-- App name — shadow layer -->
  <text x="130" y="270" font-family="Impact,'Arial Black',sans-serif" font-size="156" font-weight="900" fill="#ff4500" opacity="0.1" letter-spacing="0.06em">FORGE</text>
  <!-- App name — main -->
  <text x="130" y="265" font-family="Impact,'Arial Black',sans-serif" font-size="140" font-weight="900" fill="#ff4500" letter-spacing="0.06em" filter="url(#f)">FORGE</text>

  <!-- Category label -->
  <text x="130" y="315" font-family="'Courier New',monospace" font-size="18" fill="#4a4640" letter-spacing="0.28em">HABIT TRACKER</text>

  <!-- Divider line -->
  <line x1="130" y1="345" x2="780" y2="345" stroke="#ff4500" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Description -->
  <text x="130" y="395" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="30" fill="#d4cec8">習慣を毎日鍛え上げる。レベルアップ・連続記録・バッジ収集。</text>

  <!-- Feature chips -->
  <rect x="130" y="430" width="82" height="32" rx="4" fill="none" stroke="#ff4500" stroke-width="1" stroke-opacity="0.6"/>
  <text x="171" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ff4500" font-weight="600">無料</text>

  <rect x="226" y="430" width="106" height="32" rx="4" fill="none" stroke="#ff4500" stroke-width="1" stroke-opacity="0.35"/>
  <text x="279" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6a6560">PWA対応</text>

  <rect x="346" y="430" width="168" height="32" rx="4" fill="none" stroke="#ff4500" stroke-width="1" stroke-opacity="0.35"/>
  <text x="430" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6a6560">ゲーミフィケーション</text>

  <rect x="528" y="430" width="120" height="32" rx="4" fill="none" stroke="#ff4500" stroke-width="1" stroke-opacity="0.35"/>
  <text x="588" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6a6560">登録不要</text>

  <!-- XP bar decoration -->
  <text x="130" y="510" font-family="'Courier New',monospace" font-size="12" fill="#2a2520" letter-spacing="0.08em">XP ────────────────────────────</text>
  <rect x="130" y="518" width="580" height="2" rx="1" fill="#1a1510"/>
  <rect x="130" y="518" width="364" height="2" rx="1" fill="#ff4500" opacity="0.6"/>

  <!-- Somirai Lab -->
  <text x="1100" y="600" text-anchor="end" font-family="'Helvetica Neue','Arial',sans-serif" font-size="15" fill="#2a2520" letter-spacing="0.12em">Somirai Lab</text>

  <!-- Right decorative: angular bracket / forge icon -->
  <g transform="translate(1000, 200)" opacity="0.12">
    <polygon points="0,0 140,0 200,60 200,200 60,200 0,140" fill="none" stroke="#ff4500" stroke-width="2"/>
    <text x="100" y="130" text-anchor="middle" font-family="Impact,sans-serif" font-size="72" fill="#ff4500">⚡</text>
  </g>
</svg>
