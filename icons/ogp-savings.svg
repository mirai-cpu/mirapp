<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0L0 0 0 36" fill="none" stroke="rgba(0,210,180,0.06)" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2b4"/>
      <stop offset="100%" stop-color="#00ffdc"/>
    </linearGradient>
    <radialGradient id="glow" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2b4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00d2b4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#01080e"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="300" cy="315" rx="500" ry="380" fill="url(#glow)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#ag)"/>

  <!-- Left vertical accent -->
  <rect x="88" y="80" width="3" height="470" fill="url(#ag)"/>

  <!-- App name shadow -->
  <text x="130" y="210" font-family="'Arial Black','Impact',sans-serif" font-size="68" font-weight="900" fill="#00d2b4" opacity="0.07" letter-spacing="0.18em">節約クエスト</text>
  <!-- App name main — condensed bold -->
  <text x="130" y="205" font-family="'Arial Black','Impact',sans-serif" font-size="68" font-weight="900" fill="#d8f4f0" letter-spacing="0.08em">節約クエスト</text>

  <!-- Bloomberg-style data display -->
  <rect x="130" y="235" width="680" height="1" fill="#00d2b4" opacity="0.2"/>

  <!-- Stats display (terminal style) -->
  <text x="130" y="286" font-family="'Courier New',monospace" font-size="22" fill="#00d2b4" letter-spacing="0.04em">¥ 12,850</text>
  <text x="130" y="310" font-family="'Courier New',monospace" font-size="13" fill="#245a68" letter-spacing="0.06em">今月の支出</text>
  <text x="320" y="286" font-family="'Courier New',monospace" font-size="22" fill="#00d2b4" letter-spacing="0.04em" opacity="0.7">▼ 8.2%</text>
  <text x="320" y="310" font-family="'Courier New',monospace" font-size="13" fill="#245a68" letter-spacing="0.06em">先月比</text>
  <text x="510" y="286" font-family="'Courier New',monospace" font-size="22" fill="#2a8878" letter-spacing="0.04em">¥ 30,000</text>
  <text x="510" y="310" font-family="'Courier New',monospace" font-size="13" fill="#245a68" letter-spacing="0.06em">月予算</text>

  <!-- Budget bar -->
  <rect x="130" y="330" width="680" height="6" rx="3" fill="#061828"/>
  <rect x="130" y="330" width="292" height="6" rx="3" fill="url(#ag)" opacity="0.85"/>
  <text x="130" y="355" font-family="'Courier New',monospace" font-size="12" fill="#245a68">43% used</text>

  <!-- Divider -->
  <line x1="130" y1="378" x2="800" y2="378" stroke="#00d2b4" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Description -->
  <text x="130" y="425" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="28" fill="#5a9898">支出を記録して節約を習慣に。後悔出費レポート・月次分析付き。</text>

  <!-- Feature chips -->
  <rect x="130" y="462" width="82" height="32" rx="4" fill="none" stroke="#00d2b4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="171" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#00d2b4" font-weight="600">無料</text>
  <rect x="226" y="462" width="130" height="32" rx="4" fill="none" stroke="#00d2b4" stroke-width="1" stroke-opacity="0.2"/>
  <text x="291" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a5868">カテゴリ分析</text>
  <rect x="370" y="462" width="150" height="32" rx="4" fill="none" stroke="#00d2b4" stroke-width="1" stroke-opacity="0.2"/>
  <text x="445" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a5868">後悔出費レポート</text>

  <!-- Somirai Lab -->
  <text x="1100" y="600" text-anchor="end" font-family="'Helvetica Neue','Arial',sans-serif" font-size="15" fill="#0e3040" letter-spacing="0.12em">Somirai Lab</text>

  <!-- Right decorative: chart lines -->
  <g transform="translate(960, 160)" opacity="0.15">
    <polyline points="0,160 40,130 80,140 120,90 160,100 200,50" fill="none" stroke="#00d2b4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="200" cy="50" r="5" fill="#00d2b4"/>
  </g>
</svg>
