<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="spG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="coG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="obG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="lineF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glR" cx="35%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glR2" cx="75%" cy="40%" r="30%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1500" height="500" fill="url(#bgG)"/>
  <ellipse cx="500" cy="250" rx="500" ry="350" fill="url(#glR)"/>
  <ellipse cx="1100" cy="200" rx="400" ry="300" fill="url(#glR2)"/>

  <!-- Subtle grid -->
  <g stroke="#fb923c" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="100" x2="1500" y2="100"/>
    <line x1="0" y1="200" x2="1500" y2="200"/>
    <line x1="0" y1="300" x2="1500" y2="300"/>
    <line x1="0" y1="400" x2="1500" y2="400"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1500" height="3" fill="url(#obG)"/>

  <!-- Spark symbol (left area) -->
  <g transform="translate(380, 250)">
    <ellipse cx="0" cy="0" rx="80" ry="80" fill="none" stroke="url(#obG)" stroke-width="2" opacity="0.25" stroke-dasharray="6 10"/>
    <path d="M0 -65 C20 -32, 48 -14, 18 24 C8 44, -8 44, -18 24 C-48 -14, -20 -32, 0 -65Z" fill="url(#spG)" opacity="0.15"/>
    <circle cx="0" cy="-5" r="28" fill="url(#coG)"/>
    <circle cx="-5" cy="-14" r="10" fill="#fff" opacity="0.2"/>
    <path d="M0 -45 L4.5 -14 L0 -5 L-4.5 -14 Z" fill="#fb923c" opacity="0.85"/>
    <path d="M-36 -5 L-10 -2 L0 -5 L-10 -8 Z" fill="#fbbf24" opacity="0.6"/>
    <path d="M36 -5 L10 -2 L0 -5 L10 -8 Z" fill="#fbbf24" opacity="0.6"/>
    <path d="M0 36 L4.5 6 L0 -5 L-4.5 6 Z" fill="#fbbf24" opacity="0.4"/>
    <circle cx="56" cy="-48" r="6" fill="#fb923c" opacity="0.6"/>
    <circle cx="-50" cy="42" r="5" fill="#fbbf24" opacity="0.45"/>
    <circle cx="62" cy="30" r="4.5" fill="#6ee7b7" opacity="0.4"/>
  </g>

  <!-- Text -->
  <text x="530" y="230" font-family="'DM Sans','Helvetica Neue',sans-serif" font-size="90" font-weight="800" letter-spacing="-2" fill="#f1f5f9">Somi<tspan fill="url(#coG)">rai</tspan></text>
  <text x="530" y="310" font-family="'DM Sans','Helvetica Neue',sans-serif" font-size="36" font-weight="600" letter-spacing="0.15em" fill="url(#obG)" opacity="0.7">LAB</text>

  <rect x="530" y="328" width="300" height="2" fill="url(#lineF)" rx="1"/>

  <text x="532" y="368" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="20" fill="#94a3b8" letter-spacing="1.5">未来をかたちにする、Webツール集</text>

  <!-- Tool pills -->
  <g transform="translate(530, 400)">
    <rect x="0" y="0" width="110" height="34" rx="17" fill="#1a1220" stroke="#2a1a10" stroke-width="1"/>
    <text x="55" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fb923c" font-weight="600">野球ツール</text>

    <rect x="120" y="0" width="120" height="34" rx="17" fill="#1a1220" stroke="#2a1a10" stroke-width="1"/>
    <text x="180" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fbbf24" font-weight="600">習慣トラッカー</text>

    <rect x="250" y="0" width="100" height="34" rx="17" fill="#1a1220" stroke="#2a1a10" stroke-width="1"/>
    <text x="300" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6ee7b7" font-weight="600">メモ・ToDo</text>

    <rect x="360" y="0" width="90" height="34" rx="17" fill="#1a1220" stroke="#2a1a10" stroke-width="1"/>
    <text x="405" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#94a3b8" font-weight="600">節約管理</text>
  </g>

  <!-- Floating particles -->
  <circle cx="1350" cy="80" r="3" fill="#fb923c" opacity="0.3"/>
  <circle cx="1380" cy="120" r="2" fill="#fbbf24" opacity="0.25"/>
  <circle cx="1320" cy="150" r="2.5" fill="#6ee7b7" opacity="0.2"/>
  <circle cx="200" cy="80" r="2" fill="#fb923c" opacity="0.2"/>
  <circle cx="150" cy="420" r="2.5" fill="#fbbf24" opacity="0.2"/>

  <!-- Bottom accent -->
  <rect x="0" y="497" width="1500" height="3" fill="url(#obG)" opacity="0.4"/>
</svg>
