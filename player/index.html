<script src="/player/stats.js"></script>
<script>
  function renderRadar(stats) {
    var svg = document.getElementById('radar');
    var cx = 170, cy = 170, maxR = 112;
    var n = stats.length;
    var ns = 'http://www.w3.org/2000/svg';
    function pointAt(i, r) {
      var angle = -Math.PI / 2 + (i * 2 * Math.PI / n);
      return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
    }
    function el(name, attrs) { var e = document.createElementNS(ns, name); for (var k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }

    // 目盛りの輪(25/50/75/100)
    [0.25, 0.5, 0.75, 1].forEach(function (frac) {
      var pts = [];
      for (var i = 0; i < n; i++) pts.push(pointAt(i, maxR * frac).join(','));
      el('polygon', { points: pts.join(' '), fill: 'none', style: 'stroke:var(--rule)', 'stroke-width': frac === 1 ? 2 : 1 });
    });
    // 軸線とラベル
    stats.forEach(function (s, i) {
      var end = pointAt(i, maxR);
      el('line', { x1: cx, y1: cy, x2: end[0], y2: end[1], style: 'stroke:var(--rule)' });
      var lp = pointAt(i, maxR + 24);
      var t = el('text', { x: lp[0], y: lp[1], 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': 14, 'font-weight': 700, style: 'fill:var(--ink)', 'font-family': "'BIZ UDPGothic', sans-serif" });
      t.textContent = s.label;
    });
    // 実際の値
    var dataPts = stats.map(function (s, i) { return pointAt(i, maxR * (s.score / 100)); });
    el('polygon', { points: dataPts.map(function (p) { return p.join(','); }).join(' '), style: 'fill:rgba(245,196,0,.28);stroke:var(--ink)', 'stroke-width': 3, 'stroke-linejoin': 'round' });
    dataPts.forEach(function (p, i) {
      el('circle', { cx: p[0], cy: p[1], r: 5, fill: stats[i].color, style: 'stroke:var(--ink)', 'stroke-width': 2 });
    });
  }

  function renderList(stats) {
    var list = document.getElementById('stat-list');
    stats.forEach(function (s) {
      var a = document.createElement('a');
      a.className = 'stat-card';
      a.href = s.url;
      a.addEventListener('click', function () {
        if (typeof gtag === 'function') gtag('event', 'player_stat_click', { tool: s.tool });
      });
      a.innerHTML =
        '<span class="stat-dot" style="background:' + s.color + '"></span>' +
        '<span class="stat-main">' +
          '<span class="stat-label-row"><span class="stat-label">' + s.label + '</span><span class="stat-tool">' + s.tool + '</span></span>' +
          '<span class="stat-detail">' + s.detail + '</span>' +
        '</span>' +
        '<span class="stat-score">' + s.score + '</span>';
      list.appendChild(a);
    });
  }

  var stats = SomiraiPlayer.computeStats();
  renderRadar(stats);
  renderList(stats);
  document.getElementById('total').textContent = Math.round(stats.reduce(function (t, s) { return t + s.score; }, 0) / stats.length);
  if (typeof gtag === 'function') {
    gtag('event', 'player_view', { unique_tools_used: stats.filter(function (s) { return s.score > 0; }).length });
  }

  // 連続来訪ストリーク記録・表示
  var currentStreakCount = 0;
  (function () {
    function ld(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    try {
      var today = ld(new Date());
      var raw = localStorage.getItem('somirai:streak');
      var streak = raw ? JSON.parse(raw) : null;
      if (!streak || streak.lastDate !== today) {
        var yesterday = ld(new Date(Date.now() - 864e5));
        var count = (streak && streak.lastDate === yesterday) ? streak.count + 1 : 1;
        streak = { lastDate: today, count: count };
        localStorage.setItem('somirai:streak', JSON.stringify(streak));
      }
      if (streak) currentStreakCount = streak.count;
      if (streak && streak.count >= 2) {
        var el = document.getElementById('streak-display');
        el.textContent = streak.count + '日連続で来訪中';
        el.style.display = 'block';
      }
    } catch (e) { /* localStorage unavailable */ }
  })();

  // ── 選手カード画像の生成・シェア ──────────────────────────
  function drawPlayerCard(stats, streakCount) {
    var W = 1080, H = 1080, F = '"BIZ UDPGothic", "Hiragino Sans", sans-serif';
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');

    ctx.fillStyle = '#2B2420';
    ctx.fillRect(0, 0, W, H);
    // 上下のライン
    ctx.fillStyle = '#F5C400';
    ctx.fillRect(0, 0, W, 10);
    ctx.fillRect(0, H - 10, W, 10);

    ctx.fillStyle = '#F5F7F6';
    ctx.font = '700 72px ' + F;
    ctx.textAlign = 'center';
    ctx.fillText('MY PLAYER', W / 2, 112);
    ctx.font = '400 24px ' + F;
    ctx.fillStyle = '#B9B1AA';
    ctx.fillText('Somirai Lab', W / 2, 152);
    if (streakCount >= 2) {
      ctx.font = '700 28px ' + F;
      ctx.fillStyle = '#F5C400';
      ctx.fillText(streakCount + '日連続来訪中', W / 2, 198);
    }

    // レーダーチャート
    var cx = W / 2, cy = 525, maxR = 212;
    var n = stats.length;
    function pointAt(i, r) {
      var angle = -Math.PI / 2 + (i * 2 * Math.PI / n);
      return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
    }
    ctx.strokeStyle = '#6B5E55';
    ctx.lineWidth = 2;
    [0.25, 0.5, 0.75, 1].forEach(function (frac) {
      ctx.beginPath();
      for (var i = 0; i <= n; i++) {
        var p = pointAt(i % n, maxR * frac);
        if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
      }
      ctx.stroke();
    });
    stats.forEach(function (s, i) {
      var end = pointAt(i, maxR);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(end[0], end[1]); ctx.stroke();
      var lp = pointAt(i, maxR + 52);
      ctx.fillStyle = '#F5F7F6';
      ctx.font = '700 30px ' + F;
      ctx.textAlign = 'center';
      ctx.fillText(s.label, lp[0], lp[1] + 10);
    });
    ctx.beginPath();
    stats.forEach(function (s, i) {
      var p = pointAt(i, maxR * (s.score / 100));
      if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
    });
    ctx.closePath();
    ctx.fillStyle = 'rgba(245,196,0,0.30)';
    ctx.fill();
    ctx.strokeStyle = '#F5F7F6';
    ctx.lineWidth = 6;
    ctx.lineJoin = 'round';
    ctx.stroke();
    stats.forEach(function (s, i) {
      var p = pointAt(i, maxR * (s.score / 100));
      ctx.beginPath(); ctx.arc(p[0], p[1], 10, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#F5F7F6'; ctx.stroke();
    });

    // スコア一覧(2列)
    var listY = 835;
    ctx.textAlign = 'left';
    stats.forEach(function (s, i) {
      var col = i % 2, row = Math.floor(i / 2);
      var x = 90 + col * 470, y = listY + row * 58;
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(x, y - 9, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#F5F7F6';
      ctx.font = '700 28px ' + F;
      ctx.fillText(s.label + ' ' + s.tool, x + 24, y);
      ctx.fillStyle = '#F5C400';
      ctx.font = '700 30px ' + F;
      ctx.textAlign = 'right';
      ctx.fillText(String(s.score), x + 400, y);
      ctx.textAlign = 'left';
    });

    ctx.textAlign = 'center';
    ctx.font = '400 24px ' + F;
    ctx.fillStyle = '#B9B1AA';
    ctx.fillText('somirai.jp/player/', W / 2, H - 38);
    return canvas;
  }

  document.getElementById('share-card-btn').addEventListener('click', function () {
    var statusEl = document.getElementById('share-card-status');
    // 書体の読み込みを待ってから描く(待てなくても、代わりの書体で描く)
    var ready = (document.fonts && document.fonts.load) ? document.fonts.load('700 28px "BIZ UDPGothic"').catch(function () {}) : Promise.resolve();
    ready.then(function () {
      try {
        var canvas = drawPlayerCard(stats, currentStreakCount);
        canvas.toBlob(function (blob) {
          if (!blob) return;
          var fileName = 'my-player-' + new Date().toISOString().slice(0, 10) + '.png';
          var file = new File([blob], fileName, { type: 'image/png' });
          if (typeof gtag === 'function') gtag('event', 'player_card_share', {});
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: 'MY PLAYER', text: 'Somirai LabのMY PLAYERで選手ステータスを可視化しました #SomiraiLab' }).catch(function () { /* user cancelled */ });
          } else {
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = fileName;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
            statusEl.textContent = '画像を保存しました。Xの投稿画面で画像を添付してシェアしてください。';
            statusEl.style.display = 'block';
          }
        }, 'image/png');
      } catch (e) {
        statusEl.textContent = '画像の生成に失敗しました。';
        statusEl.style.display = 'block';
      }
    });
  });

  Tool.initTheme(); Tool.initCookie();
</script>
