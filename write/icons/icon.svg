<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="penG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glowG" cx="45%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgG)"/>

  <ellipse cx="240" cy="240" rx="200" ry="200" fill="url(#glowG)"/>

  <!-- Ghost Spark -->
  <g opacity=".08">
    <ellipse cx="256" cy="256" rx="160" ry="160" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="8 12"/>
    <circle cx="256" cy="160" r="24" fill="#f97316"/>
    <path d="M256 120 L260 150 L256 160 L252 150Z" fill="#fb923c"/>
  </g>

  <!-- Main: Pen -->
  <g transform="translate(280, 230) rotate(40)">
    <!-- Pen body -->
    <rect x="-16" y="-140" width="32" height="200" rx="4" fill="url(#penG)" opacity=".85"/>
    <!-- Tip -->
    <polygon points="0,72 -16,60 16,60" fill="#ea580c" opacity=".9"/>
    <!-- Grip ring -->
    <rect x="-16" y="40" width="32" height="8" fill="#fff" opacity=".15" rx="2"/>
    <!-- Eraser end -->
    <rect x="-16" y="-140" width="32" height="22" rx="4" fill="#ea580c" opacity=".6"/>
    <!-- Shine -->
    <rect x="-6" y="-120" width="6" height="140" rx="3" fill="#fff" opacity=".1"/>
  </g>

  <!-- Writing lines -->
  <g opacity=".7">
    <rect x="95" y="310" width="180" height="10" rx="5" fill="#fb923c" opacity=".5"/>
    <rect x="95" y="340" width="145" height="10" rx="5" fill="#fbbf24" opacity=".4"/>
    <rect x="95" y="370" width="165" height="10" rx="5" fill="#6ee7b7" opacity=".35"/>
    <rect x="95" y="400" width="120" height="10" rx="5" fill="#fb923c" opacity=".25"/>
  </g>

  <!-- Line dots (timeline) -->
  <g opacity=".6">
    <circle cx="78" cy="315" r="6" fill="#f97316"/>
    <circle cx="78" cy="345" r="6" fill="#fbbf24"/>
    <circle cx="78" cy="375" r="6" fill="#6ee7b7"/>
    <circle cx="78" cy="405" r="6" fill="#fb923c" opacity=".5"/>
    <line x1="78" y1="321" x2="78" y2="339" stroke="#fb923c" stroke-width="1.5" opacity=".3"/>
    <line x1="78" y1="351" x2="78" y2="369" stroke="#fbbf24" stroke-width="1.5" opacity=".3"/>
    <line x1="78" y1="381" x2="78" y2="399" stroke="#6ee7b7" stroke-width="1.5" opacity=".3"/>
  </g>

  <!-- Accent -->
  <circle cx="400" cy="110" r="5" fill="#fbbf24" opacity=".2"/>
  <circle cx="420" cy="390" r="4" fill="#6ee7b7" opacity=".18"/>
</svg>
