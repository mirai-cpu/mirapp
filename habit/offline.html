<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Quest - オフライン</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1c1c21;
      color: #ece9e3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      padding: 20px;
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #f5f0e8; }
    p { color: #a09d96; font-size: 0.875rem; line-height: 1.6; }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background: #6ee7b7;
      color: #1c1c21;
      border: none;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <div class="icon">⚔️</div>
    <h1>オフラインです</h1>
    <p>インターネット接続がありません。<br />習慣データはローカルに保存されているので、<br />接続後に再度アクセスしてください。</p>
    <button onclick="location.reload()">再接続を試みる</button>
  </div>
</body>
</html>
