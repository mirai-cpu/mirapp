<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="coG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="obG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="flG" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgG)"/>

  <!-- Orbit ring -->
  <ellipse cx="256" cy="220" rx="140" ry="140" fill="none" stroke="url(#obG)" stroke-width="3" opacity=".2" stroke-dasharray="10 14"/>

  <!-- Core spark -->
  <circle cx="256" cy="180" r="40" fill="url(#coG)"/>
  <circle cx="248" cy="165" r="14" fill="#fff" opacity=".22"/>
  <path d="M256 110 L262 160 L256 180 L250 160Z" fill="#fb923c" opacity=".85"/>

  <!-- Flame shape -->
  <path d="M256 420 C220 400, 175 360, 175 310 C175 270, 200 250, 220 260 C210 230, 230 200, 256 210 C282 200, 302 230, 292 260 C312 250, 337 270, 337 310 C337 360, 292 400, 256 420Z" fill="url(#flG)" opacity=".35"/>
  <path d="M256 420 C235 405, 210 375, 210 340 C210 310, 235 295, 256 310 C277 295, 302 310, 302 340 C302 375, 277 405, 256 420Z" fill="#f97316" opacity=".3"/>
  <path d="M256 410 C245 400, 232 380, 232 358 C232 338, 248 330, 256 342 C264 330, 280 338, 280 358 C280 380, 267 400, 256 410Z" fill="#fbbf24" opacity=".35"/>

  <!-- Streak number -->
  <text x="256" y="380" text-anchor="middle" font-family="'DM Sans',system-ui" font-size="48" font-weight="900" fill="#fff" opacity=".8">7</text>

  <!-- Orbiting dots -->
  <circle cx="355" cy="110" r="10" fill="#fb923c" opacity=".6"/>
  <circle cx="140" cy="280" r="8" fill="#fbbf24" opacity=".45"/>
  <circle cx="378" cy="280" r="7" fill="#6ee7b7" opacity=".4"/>
</svg>
