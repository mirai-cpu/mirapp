    <line x1="282" y1="394" x2="288" y2="396"/>
  </g>

  <!-- Orbiting dots -->
  <circle cx="350" cy="120" r="10" fill="#fb923c" opacity=".6"/>
  <circle cx="150" cy="290" r="8" fill="#fbbf24" opacity=".45"/>
  <circle cx="370" cy="270" r="7" fill="#6ee7b7" opacity=".4"/>
