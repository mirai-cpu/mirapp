<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ballG" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgG)"/>

  <!-- Ambient glow -->
  <ellipse cx="256" cy="240" rx="200" ry="200" fill="url(#glowG)"/>

  <!-- Ghost Spark (very subtle background) -->
  <g opacity=".08">
    <ellipse cx="256" cy="256" rx="160" ry="160" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="8 12"/>
    <circle cx="256" cy="160" r="24" fill="#f97316"/>
    <path d="M256 120 L260 150 L256 160 L252 150Z" fill="#fb923c"/>
  </g>

  <!-- Main: Baseball -->
  <circle cx="256" cy="265" r="120" fill="url(#ballG)" opacity=".9"/>
  <circle cx="256" cy="265" r="116" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity=".3"/>

  <!-- Highlight -->
  <ellipse cx="220" cy="210" rx="40" ry="25" fill="#fff" opacity=".12" transform="rotate(-25 220 210)"/>

  <!-- Stitching curves -->
  <path d="M200 155 C185 200, 185 260, 195 320 C200 345, 210 370, 220 385" fill="none" stroke="#fff" stroke-width="3.5" opacity=".7" stroke-linecap="round"/>
  <path d="M312 155 C327 200, 327 260, 317 320 C312 345, 302 370, 292 385" fill="none" stroke="#fff" stroke-width="3.5" opacity=".7" stroke-linecap="round"/>

  <!-- Stitch marks left -->
  <g stroke="#fff" stroke-width="2" opacity=".5" stroke-linecap="round">
    <line x1="198" y1="170" x2="185" y2="162"/>
    <line x1="190" y1="200" x2="177" y2="195"/>
    <line x1="186" y1="230" x2="173" y2="228"/>
    <line x1="185" y1="260" x2="172" y2="260"/>
    <line x1="188" y1="290" x2="175" y2="292"/>
    <line x1="193" y1="318" x2="180" y2="323"/>
    <line x1="200" y1="345" x2="188" y2="352"/>
    <line x1="210" y1="368" x2="200" y2="377"/>
  </g>

  <!-- Stitch marks right -->
  <g stroke="#fff" stroke-width="2" opacity=".5" stroke-linecap="round">
    <line x1="314" y1="170" x2="327" y2="162"/>
    <line x1="322" y1="200" x2="335" y2="195"/>
    <line x1="326" y1="230" x2="339" y2="228"/>
    <line x1="327" y1="260" x2="340" y2="260"/>
    <line x1="324" y1="290" x2="337" y2="292"/>
    <line x1="319" y1="318" x2="332" y2="323"/>
    <line x1="312" y1="345" x2="324" y2="352"/>
    <line x1="302" y1="368" x2="312" y2="377"/>
  </g>

  <!-- Subtle accent dots -->
  <circle cx="400" cy="100" r="6" fill="#fbbf24" opacity=".25"/>
  <circle cx="110" cy="410" r="5" fill="#6ee7b7" opacity=".2"/>
</svg>
