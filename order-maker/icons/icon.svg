<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boardG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1f35"/>
      <stop offset="100%" stop-color="#1a1220"/>
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgG)"/>

  <ellipse cx="256" cy="270" rx="200" ry="200" fill="url(#glowG)"/>

  <!-- Ghost Spark -->
  <g opacity=".08">
    <ellipse cx="256" cy="256" rx="160" ry="160" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="8 12"/>
    <circle cx="256" cy="160" r="24" fill="#f97316"/>
    <path d="M256 120 L260 150 L256 160 L252 150Z" fill="#fb923c"/>
  </g>

  <!-- Main: Clipboard -->
  <rect x="120" y="100" width="272" height="340" rx="20" fill="url(#boardG)" stroke="#fb923c" stroke-width="2.5" opacity=".85"/>
  <!-- Clip -->
  <rect x="200" y="80" width="112" height="40" rx="20" fill="#f97316" opacity=".8"/>
  <circle cx="256" cy="100" r="8" fill="#1a1220" opacity=".6"/>

  <!-- Row 1 -->
  <circle cx="168" cy="175" r="14" fill="#f97316" opacity=".85"/>
  <text x="168" y="180" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="#fff" opacity=".9">1</text>
  <rect x="198" y="165" width="160" height="18" rx="9" fill="#fb923c" opacity=".35"/>

  <!-- Row 2 -->
  <circle cx="168" cy="220" r="14" fill="#fbbf24" opacity=".75"/>
  <text x="168" y="225" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="#fff" opacity=".9">2</text>
  <rect x="198" y="210" width="140" height="18" rx="9" fill="#fbbf24" opacity=".3"/>

  <!-- Row 3 -->
  <circle cx="168" cy="265" r="14" fill="#fb923c" opacity=".65"/>
  <text x="168" y="270" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="#fff" opacity=".9">3</text>
  <rect x="198" y="255" width="150" height="18" rx="9" fill="#fb923c" opacity=".28"/>

  <!-- Row 4 -->
  <circle cx="168" cy="310" r="14" fill="#6ee7b7" opacity=".6"/>
  <text x="168" y="315" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="#fff" opacity=".9">4</text>
  <rect x="198" y="300" width="130" height="18" rx="9" fill="#6ee7b7" opacity=".25"/>

  <!-- Row 5 -->
  <circle cx="168" cy="355" r="14" fill="#f97316" opacity=".5"/>
  <text x="168" y="360" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="#fff" opacity=".8">5</text>
  <rect x="198" y="345" width="120" height="18" rx="9" fill="#f97316" opacity=".2"/>

  <!-- Row 6 (faded) -->
  <circle cx="168" cy="400" r="14" fill="#fbbf24" opacity=".35"/>
  <text x="168" y="405" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="#fff" opacity=".5">6</text>
  <rect x="198" y="390" width="110" height="18" rx="9" fill="#fbbf24" opacity=".15"/>

  <!-- Accent dots -->
  <circle cx="405" cy="95" r="5" fill="#fbbf24" opacity=".2"/>
  <circle cx="100" cy="440" r="4" fill="#6ee7b7" opacity=".18"/>
</svg>
