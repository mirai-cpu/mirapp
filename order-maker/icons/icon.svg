<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="coG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="obG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgG)"/>

  <!-- Orbit ring -->
  <ellipse cx="256" cy="210" rx="130" ry="130" fill="none" stroke="url(#obG)" stroke-width="3" opacity=".2" stroke-dasharray="10 14"/>

  <!-- Core spark -->
  <circle cx="256" cy="175" r="42" fill="url(#coG)"/>
  <circle cx="248" cy="160" r="14" fill="#fff" opacity=".22"/>
  <path d="M256 105 L262 157 L256 175 L250 157Z" fill="#fb923c" opacity=".85"/>
  <path d="M196 175 L240 179 L256 175 L240 171Z" fill="#fbbf24" opacity=".65"/>
  <path d="M316 175 L272 179 L256 175 L272 171Z" fill="#fbbf24" opacity=".65"/>

  <!-- Clipboard -->
  <rect x="170" y="260" width="172" height="200" rx="14" fill="none" stroke="#fb923c" stroke-width="3" opacity=".5"/>
  <rect x="220" y="248" width="72" height="24" rx="12" fill="#fb923c" opacity=".5"/>

  <!-- Lineup rows -->
  <g opacity=".6">
    <circle cx="204" cy="305" r="8" fill="#f97316" opacity=".7"/>
    <rect x="224" y="299" width="96" height="12" rx="6" fill="#fb923c" opacity=".35"/>
    <circle cx="204" cy="340" r="8" fill="#fbbf24" opacity=".6"/>
    <rect x="224" y="334" width="80" height="12" rx="6" fill="#fbbf24" opacity=".3"/>
    <circle cx="204" cy="375" r="8" fill="#6ee7b7" opacity=".5"/>
    <rect x="224" y="369" width="88" height="12" rx="6" fill="#6ee7b7" opacity=".25"/>
    <circle cx="204" cy="410" r="8" fill="#fb923c" opacity=".4"/>
    <rect x="224" y="404" width="72" height="12" rx="6" fill="#fb923c" opacity=".2"/>
  </g>

  <!-- Orbiting dots -->
  <circle cx="355" cy="110" r="10" fill="#fb923c" opacity=".6"/>
  <circle cx="138" cy="260" r="8" fill="#fbbf24" opacity=".45"/>
  <circle cx="375" cy="310" r="7" fill="#6ee7b7" opacity=".4"/>
</svg>
