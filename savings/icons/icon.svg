<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="coG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="obG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="cnG" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgG)"/>

  <!-- Orbit ring -->
  <ellipse cx="256" cy="210" rx="135" ry="135" fill="none" stroke="url(#obG)" stroke-width="3" opacity=".2" stroke-dasharray="10 14"/>

  <!-- Core spark -->
  <circle cx="256" cy="175" r="40" fill="url(#coG)"/>
  <circle cx="248" cy="160" r="14" fill="#fff" opacity=".22"/>
  <path d="M256 105 L262 157 L256 175 L250 157Z" fill="#fb923c" opacity=".85"/>
  <path d="M198 175 L240 179 L256 175 L240 171Z" fill="#fbbf24" opacity=".65"/>
  <path d="M314 175 L272 179 L256 175 L272 171Z" fill="#fbbf24" opacity=".65"/>

  <!-- Stacked coins -->
  <g transform="translate(256, 385)">
    <!-- Bottom coin -->
    <ellipse cx="0" cy="30" rx="65" ry="18" fill="#ea580c" opacity=".4"/>
    <ellipse cx="0" cy="24" rx="65" ry="18" fill="url(#cnG)" opacity=".45"/>
    <!-- Middle coin -->
    <ellipse cx="0" cy="8" rx="60" ry="16" fill="#ea580c" opacity=".45"/>
    <ellipse cx="0" cy="2" rx="60" ry="16" fill="url(#cnG)" opacity=".55"/>
    <!-- Top coin -->
    <ellipse cx="0" cy="-14" rx="55" ry="14" fill="#ea580c" opacity=".5"/>
    <ellipse cx="0" cy="-20" rx="55" ry="14" fill="url(#cnG)" opacity=".65"/>
    <!-- Yen mark on top coin -->
    <text x="0" y="-13" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="800" fill="#fff" opacity=".6">¥</text>
  </g>

  <!-- Rising arrow -->
  <g opacity=".5">
    <path d="M340 420 L340 300 L370 330" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M340 300 L310 330" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Orbiting dots -->
  <circle cx="360" cy="110" r="10" fill="#fb923c" opacity=".6"/>
  <circle cx="135" cy="270" r="8" fill="#fbbf24" opacity=".45"/>
  <circle cx="385" cy="280" r="7" fill="#6ee7b7" opacity=".4"/>
</svg>
