<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01080e"/>
      <stop offset="100%" stop-color="#041414"/>
    </linearGradient>
    <linearGradient id="chartG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2b4"/>
      <stop offset="100%" stop-color="#00ffdc"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00d2b4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00d2b4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <ellipse cx="300" cy="220" rx="220" ry="180" fill="url(#glow)"/>

  <!-- Grid lines -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="#00d2b4" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="80" y1="300" x2="432" y2="300" stroke="#00d2b4" stroke-width="1" stroke-opacity="0.1"/>
  <line x1="80" y1="240" x2="432" y2="240" stroke="#00d2b4" stroke-width="1" stroke-opacity="0.1"/>
  <line x1="80" y1="180" x2="432" y2="180" stroke="#00d2b4" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Chart fill area -->
  <path d="M 80 360 L 80 310 L 170 280 L 256 240 L 340 200 L 432 150 L 432 360 Z"
    fill="#00d2b4" opacity="0.1"/>

  <!-- Chart line -->
  <polyline
    points="80,310 170,280 256,240 340,200 432,150"
    fill="none"
    stroke="url(#chartG)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="80" cy="310" r="10" fill="#00d2b4" opacity="0.7"/>
  <circle cx="170" cy="280" r="10" fill="#00d2b4" opacity="0.8"/>
  <circle cx="256" cy="240" r="10" fill="#00d2b4" opacity="0.85"/>
  <circle cx="340" cy="200" r="10" fill="#00d2b4" opacity="0.9"/>
  <circle cx="432" cy="150" r="14" fill="#00ffdc"/>
  <circle cx="432" cy="150" r="7" fill="#fff" opacity="0.9"/>

  <!-- Axes -->
  <line x1="80" y1="120" x2="80" y2="370" stroke="#00d2b4" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="70" y1="360" x2="442" y2="360" stroke="#00d2b4" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Bottom label bar -->
  <rect x="180" y="430" width="152" height="4" rx="2" fill="#00d2b4" opacity="0.25"/>
</svg>
