const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const fmt = m => pad(Math.floor(m / 60)) + ':' + pad(Math.round(m % 60));

  },
  '熊本': { '熊本市': W('中央区 東区 西区 南区 北区') }
};
function fillCityList() {
  const dl = $('cityList');
  dl.innerHTML = '';
  const cities = WARDS[PREFS[$('pref').value][0]] || {};
  Object.entries(cities).forEach(([city, wards]) => {
    if (city) dl.appendChild(Object.assign(document.createElement('option'), { value: city }));
    wards.forEach(w => dl.appendChild(Object.assign(document.createElement('option'), { value: city + w })));
  });
}

// 解決済みの場所。key が現在の入力と一致すれば再検索せずに使う
let resolved = null;
const prefFull = i => { const n = PREFS[i][0]; return n === '北海道' ? n : n === '東京' ? '東京都' : (n === '大阪' || n === '京都') ? n + '府' : n + '県'; };

PREFS.forEach(([name], i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = prefFull(i);
  if (name === '東京') o.selected = true;
  $('pref').appendChild(o);
});
const keyOf = () => $('pref').value + '|' + $('city').value.trim();
function setPlaceNow(label) { $('placeNow').innerHTML = '選択中: <b></b>'; $('placeNow').querySelector('b').textContent = label; }
function currentLabel() { return prefFull($('pref').value) + $('city').value.trim(); }
fillCityList();
$('pref').addEventListener('change', () => { fillCityList(); $('geo').textContent = '現在地を使う'; setPlaceNow(currentLabel()); });
$('city').addEventListener('input', () => { $('geo').textContent = '現在地を使う'; setPlaceNow(currentLabel()); });

// 国土地理院の住所検索で市区町村の位置を取得
async function geocodeCity() {
  const q = currentLabel();
  const res = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q));
  if (!res.ok) throw new Error('geocode');
  const list = await res.json();
  const hit = list.find(x => x.properties.title.startsWith(prefFull($('pref').value))) || list[0];
  if (!hit) return null;
  const [lon, lat] = hit.geometry.coordinates;
  return { lat, lon, label: hit.properties.title };
}

  const d = new Date();
  const iso = x => x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
  $('date').value = iso(d);
  $('date').min = iso(d);
  const max = new Date(d); max.setDate(max.getDate() + 15);
  $('date').max = iso(max);
})();

// 現在地 → 都道府県・市区町村(区まで)。共通部品 /shared/geo.js を使う
$('geo').addEventListener('click', async () => {
  clearErr();
  $('geo').textContent = '取得中…';
  try {
    const loc = await SomiraiGeo.locate();
    if (loc.prefIdx != null) {
      $('pref').value = loc.prefIdx; fillCityList(); $('city').value = loc.muni;
      resolved = { key: keyOf(), lat: loc.lat, lon: loc.lon, label: loc.label };
      setPlaceNow(loc.label + '(現在地)');
    } else {
      resolved = { key: keyOf(), lat: loc.lat, lon: loc.lon, label: '現在地' };
      setPlaceNow('現在地(地名は取得できませんでした)');
    }
    $('geo').textContent = '現在地を使用中';
  } catch (err) {
    $('geo').textContent = '現在地を使う';
    showErr(SomiraiGeo.errorMessage(err) + '都道府県と市区町村を入力してください。');
  }
});

function showErr(msg) { $('err').textContent = msg; $('err').classList.add('show'); }
function clearErr() { $('err').classList.remove('show'); }

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  clearErr();
  const btn = $('go');
  btn.disabled = true; btn.textContent = '調べています…';
  try {
    const date = $('date').value;
    const place = await resolvePlace();
    if (!place) { $('result').classList.remove('show'); showErr('「' + currentLabel() + '」が見つかりませんでした。市区町村名を確認してください。'); return; }
    const coords = { lat: place.lat, lon: place.lon };
    const url = 'https://api.open-meteo.com/v1/forecast'
      + `?latitude=${coords.lat.toFixed(4)}&longitude=${coords.lon.toFixed(4)}`
      + '&daily=sunset&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&wind_speed_unit=ms'
      + `&timezone=Asia%2FTokyo&start_date=${date}&end_date=${date}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('http');
    const data = await res.json();
    if (!data.daily || !data.daily.sunset || !data.daily.sunset[0]) throw new Error('nodata');
    render(data, place.label);
  } catch (err) {
    $('result').classList.remove('show');
    showErr('データを取得できませんでした。通信状況を確認して、もう一度試してください。');
  } finally {
    btn.disabled = false; btn.textContent = '日没を調べる';
  }
});

async function resolvePlace() {
  const key = keyOf();
  if (resolved && resolved.key === key) return resolved;
  if (!$('city').value.trim()) {
    const [, lat, lon] = PREFS[$('pref').value];
    resolved = { key, lat, lon, label: prefFull($('pref').value) };
    return resolved;
  }
  const g = await geocodeCity();
  if (!g) return null;
  resolved = { key, lat: g.lat, lon: g.lon, label: g.label };
  setPlaceNow(g.label);
  return resolved;
}

// 天気コード(WMO)→ 種類・表示名。severity が大きいほど野球に不向き
function wxInfo(code) {
  if (code === 0) return { kind: 'sun', name: '快晴', sev: 0 };
  if (code === 1) return { kind: 'sun', name: '晴れ', sev: 0 };
  if (code === 2) return { kind: 'partly', name: '晴れ時々曇り', sev: 1 };
  if (code === 3) return { kind: 'cloud', name: '曇り', sev: 1 };
  if (code === 45 || code === 48) return { kind: 'fog', name: '霧', sev: 2 };
  if (code >= 51 && code <= 57) return { kind: 'rain', name: '霧雨', sev: 3 };
  if (code >= 61 && code <= 67) return { kind: 'rain', name: code >= 65 ? '強い雨' : '雨', sev: 4 };
  if (code >= 71 && code <= 77) return { kind: 'snow', name: '雪', sev: 4 };
  if (code >= 80 && code <= 82) return { kind: 'rain', name: 'にわか雨', sev: 4 };
  if (code === 85 || code === 86) return { kind: 'snow', name: 'にわか雪', sev: 4 };
  if (code >= 95) return { kind: 'thunder', name: '雷雨', sev: 5 };
  return { kind: 'cloud', name: '曇り', sev: 1 };
}
const SUN = 'var(--ic-sun)', CLOUD = 'var(--ic-cloud)', RAIN = 'var(--ic-rain)';
function wxIcon(kind) {
  const cloud = (c, x = 0, y = 0) => `<path transform="translate(${x} ${y})" d="M9 21h13a5 5 0 0 0 .6-9.96A7 7 0 0 0 9.2 12.2 4.5 4.5 0 0 0 9 21z" fill="${c}"/>`;
  const sun = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${SUN}"/>`;
  const rays = `<g stroke="${SUN}" stroke-width="2" stroke-linecap="round"><path d="M16 2v3M16 27v3M2 16h3M27 16h3M6.1 6.1l2.1 2.1M23.8 23.8l2.1 2.1M6.1 25.9l2.1-2.1M23.8 8.2l2.1-2.1"/></g>`;
  const drops = `<g stroke="${RAIN}" stroke-width="2" stroke-linecap="round"><path d="M11 24l-1.5 4M16 24l-1.5 4M21 24l-1.5 4"/></g>`;
  const body = {
    sun: rays + sun(16, 16, 6),
    partly: sun(12, 11, 5) + `<g stroke="${SUN}" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2M2.5 11h2M5.3 4.3l1.4 1.4M18.7 4.3l-1.4 1.4"/></g>` + cloud(CLOUD, 3, 5),
    cloud: cloud(CLOUD, 0, 1),
    fog: cloud(CLOUD, 0, -3) + `<g stroke="${CLOUD}" stroke-width="2" stroke-linecap="round"><path d="M6 24h20M9 28h14"/></g>`,
    rain: cloud(CLOUD, 0, -4) + drops,
    snow: cloud(CLOUD, 0, -4) + `<g fill="var(--ic-snow)"><circle cx="11" cy="26" r="1.8"/><circle cx="16" cy="28" r="1.8"/><circle cx="21" cy="26" r="1.8"/></g>`,
    thunder: cloud(CLOUD, 0, -4) + `<path d="M17 18l-5 8h4l-1.5 5 6.5-9h-4.2z" fill="${SUN}"/>`
  }[kind];
  return `<svg viewBox="0 0 32 32" aria-hidden="true">${body}</svg>`;
}

function render(data, label) {
  $('place').textContent = label + 'の日没と天気';
  const start = toMin($('start').value);
  const per = +$('inning').value;
  const buffer = +$('buffer').value;
  const sunset = toMin(data.daily.sunset[0].split('T')[1]);
  const limit = sunset - buffer;
  const end9 = start + per * 9;
  const done = Math.max(0, Math.min(9, Math.floor((limit - start) / per)));
  const ok = end9 <= limit;

  $('verdict').textContent = ok ? '9回まで間に合います' : (done >= 1 ? `${done}回で日没です` : '開始時点で日没に間に合いません');
  $('verdict').className = 'verdict ' + (ok ? 'ok' : 'ng');
  const margin = Math.abs(limit - end9);
  $('verdictSub').textContent = ok
    ? `9回終了の予定は日没の${buffer}分前から数えて、あと${margin}分の余裕があります。`
    : `9回を終えるには、日没の${buffer}分前の時点から${margin}分足りません。`;

  $('sunset').textContent = fmt(sunset);
  $('sunsetBig').textContent = fmt(sunset);
  $('sunsetSub').textContent = '日没の' + buffer + '分前(' + fmt(limit) + ')までを、試合に使えます';
  $('end').innerHTML = fmt(end9) + (ok ? '' : '<small>日没後</small>');
  $('innings').innerHTML = done + '<small>回まで</small>';

  // 試合時間帯(開始〜日没 or 9回終了の早い方)の天気
  const hours = data.hourly.time.map((t, i) => ({
    h: +t.split('T')[1].slice(0, 2),
    temp: data.hourly.temperature_2m[i], pop: data.hourly.precipitation_probability[i],
    code: data.hourly.weather_code[i], wind: data.hourly.wind_speed_10m[i]
  }));
  const from = Math.floor(start / 60), to = Math.ceil(Math.min(end9, sunset) / 60);
  const win = hours.filter(x => x.h >= from && x.h <= to && x.temp != null);
  if (win.length) {
    const worst = win.reduce((a, x) => wxInfo(x.code).sev > wxInfo(a.code).sev ? x : a, win[0]);
    const pops = win.map(x => x.pop ?? 0), temps = win.map(x => x.temp);
    $('wx').innerHTML = wxInfo(worst.code).name + '<small>' + Math.round(Math.min(...temps)) + '〜' + Math.round(Math.max(...temps)) + '℃ 降水' + Math.max(...pops) + '%</small>';
  } else {
    $('wx').textContent = '—';
  }

  // 時間ごとの天気(開始の1時間前〜9回終了か日没の遅い方まで)
  const strip = hours.filter(x => x.h >= from && x.h <= Math.ceil(Math.max(end9, sunset) / 60) && x.temp != null);
  $('hoursTitle').textContent = '時間ごとの天気(薄い表示は日没後)';
  $('hours').innerHTML = strip.map(x => {
    const w = wxInfo(x.code), pop = x.pop ?? 0;
    return `<div class="hour${x.h * 60 >= sunset ? ' after' : ''}"><div class="h">${x.h}時</div>${wxIcon(w.kind)}<div class="t">${Math.round(x.temp)}℃</div><div class="p${pop >= 50 ? ' rain' : ''}">降水${pop}%</div><div class="w">${w.name}・風${Math.round(x.wind)}m/s</div></div>`;
  }).join('');

  drawSky(start, end9, sunset, per, limit);

  $('note').textContent = ok
    ? 'ギリギリの場合は、開始を早めるか、1イニングの所要時間を短くする(投球練習を省くなど)と余裕が増えます。'
    : `開始を${fmt(start - (end9 - limit))}より前にすると、9回まで日没に間に合います。コールドや7回制の取り決めも選択肢です。`;

  $('result').classList.add('show');
}

function drawSky(start, end9, sunset, per, limit) {
  const a = Math.min(start, sunset) - 30;
  const b = Math.max(end9, sunset) + 30;
  const span = b - a;
  const pct = m => ((m - a) / span * 100);
  const sunP = pct(sunset);

  // 昼の青 → 日没に向けて橙 → 日没後は藍
  $('sky').style.background =
    `linear-gradient(90deg, #4f8fd6 0%, #8fb7e0 ${Math.max(0, sunP - 28)}%, #ffb067 ${Math.max(0, sunP - 6)}%, #ff7a45 ${sunP}%, #4a3560 ${Math.min(100, sunP + 8)}%, #14110F 100%)`;

  let html = `<div class="game" style="left:${pct(start)}%;width:${pct(end9) - pct(start)}%"></div>`;
  for (let i = 1; i <= 9; i++) {
    const t = start + per * i;
    html += `<div class="tick${t > limit ? ' over' : ''}" style="left:${pct(t)}%"></div>`;
  }
  html += `<div class="sunline" style="left:calc(${sunP}% - 1.5px)"></div>`;
  $('sky').innerHTML = html;

  $('axis').innerHTML =
    `<span style="left:${pct(start)}%">${fmt(start)}開始</span>` +
    `<span class="sun-label" style="left:${Math.min(Math.max(sunP, 8), 92)}%;top:0">${fmt(sunset)}日没</span>`;
  // 開始ラベルと日没ラベルが重なる場合は開始ラベルを左寄せ
  if (Math.abs(sunP - pct(start)) < 18) $('axis').firstChild.style.left = Math.max(pct(start) - 8, 4) + '%';
}

// 他のアプリからのリンク用: ?pref=東京&city=新宿区&date=2026-11-01&start=09:00
(function applyQuery() {
  const q = new URLSearchParams(location.search);
  const pref = q.get('pref');
  if (!pref) return;
  const idx = PREFS.findIndex(p => p[0] === pref.replace(/[都道府県]$/, '') || p[0] === pref);
  if (idx < 0) return;
  $('pref').value = idx;
  fillCityList();
  $('city').value = (q.get('city') || '').slice(0, 30);
  const date = q.get('date');
  if (date && date >= $('date').min && date <= $('date').max) $('date').value = date;
  const start = q.get('start');
  if (start && /^\d{2}:\d{2}$/.test(start)) $('start').value = start;
  setPlaceNow(currentLabel());
  $('form').requestSubmit();
})();
</script>
