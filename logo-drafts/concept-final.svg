<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="sparkG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="coreG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="orbitG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>

  <!-- Symbol -->
  <g transform="translate(52, 60)">
    <!-- Outer orbit ring -->
    <ellipse cx="0" cy="0" rx="30" ry="30" fill="none" stroke="url(#orbitG)" stroke-width="1.8" opacity="0.35" stroke-dasharray="5 7"/>

    <!-- Inner glow shape -->
    <path d="M0 -24 C9 -12, 20 -5, 7 9 C3 18, -3 18, -7 9 C-20 -5, -9 -12, 0 -24Z" fill="url(#sparkG)" opacity="0.18"/>

    <!-- Core -->
    <circle cx="0" cy="-2" r="10" fill="url(#coreG)"/>
    <!-- Core inner highlight -->
    <circle cx="-2" cy="-5" r="3.5" fill="#fff" opacity="0.25"/>

    <!-- Sparkle cross -->
    <path d="M0 -18 L1.8 -6 L0 -2 L-1.8 -6 Z" fill="#f97316" opacity="0.9"/>
    <path d="M-14 -2 L-4 -0.5 L0 -2 L-4 -3.5 Z" fill="#fb923c" opacity="0.7"/>
    <path d="M14 -2 L4 -0.5 L0 -2 L4 -3.5 Z" fill="#fb923c" opacity="0.7"/>
    <path d="M0 14 L1.8 2 L0 -2 L-1.8 2 Z" fill="#fbbf24" opacity="0.5"/>

    <!-- Orbiting dots -->
    <circle cx="22" cy="-18" r="3" fill="#fb923c" opacity="0.7"/>
    <circle cx="-20" cy="16" r="2.5" fill="#fbbf24" opacity="0.55"/>
    <circle cx="26" cy="12" r="2" fill="#6ee7b7" opacity="0.5"/>
  </g>

  <!-- Text: Somirai -->
  <text x="105" y="62" font-family="'DM Sans', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.02em" fill="#1e293b">
    Somi<tspan fill="url(#coreG)">rai</tspan>
  </text>

  <!-- Text: Lab -->
  <text x="105" y="88" font-family="'DM Sans', system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="0.18em" fill="url(#orbitG)" opacity="0.8">
    LAB
  </text>

  <!-- Decorative dots -->
  <circle cx="325" cy="38" r="2.5" fill="#fb923c" opacity="0.35"/>
  <circle cx="345" cy="52" r="1.8" fill="#fbbf24" opacity="0.3"/>
  <circle cx="335" cy="72" r="1.2" fill="#6ee7b7" opacity="0.25"/>
</svg>
