<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="sparkG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="coreG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="120" rx="16" fill="#0f172a"/>

  <!-- Symbol: Abstract spark / seed of future -->
  <g transform="translate(52, 60)" filter="url(#glow)">
    <!-- Outer orbit ring -->
    <ellipse cx="0" cy="0" rx="28" ry="28" fill="none" stroke="url(#sparkG)" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 6"/>

    <!-- Inner dynamic shape -->
    <path d="M0 -22 C8 -10, 18 -4, 6 8 C2 16, -2 16, -6 8 C-18 -4, -8 -10, 0 -22Z" fill="url(#sparkG)" opacity="0.25"/>

    <!-- Core spark -->
    <circle cx="0" cy="-2" r="8" fill="url(#coreG)"/>

    <!-- Sparkle cross -->
    <path d="M0 -16 L1.5 -5 L0 -2 L-1.5 -5 Z" fill="#fff" opacity="0.9"/>
    <path d="M-12 -2 L-3 -0.5 L0 -2 L-3 -3.5 Z" fill="#fff" opacity="0.7"/>
    <path d="M12 -2 L3 -0.5 L0 -2 L3 -3.5 Z" fill="#fff" opacity="0.7"/>
    <path d="M0 12 L1.5 1 L0 -2 L-1.5 1 Z" fill="#fff" opacity="0.6"/>

    <!-- Tiny orbiting dots -->
    <circle cx="20" cy="-16" r="2" fill="#6ee7b7" opacity="0.7"/>
    <circle cx="-18" cy="14" r="1.5" fill="#a78bfa" opacity="0.6"/>
    <circle cx="24" cy="10" r="1.2" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- Text: Somirai -->
  <text x="105" y="62" font-family="'DM Sans', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.02em" fill="#f1f5f9">
    Somi<tspan fill="url(#sparkG)">rai</tspan>
  </text>

  <!-- Text: Lab -->
  <text x="105" y="88" font-family="'DM Sans', system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="0.18em" fill="url(#sparkG)" opacity="0.7">
    LAB
  </text>

  <!-- Decorative dots -->
  <circle cx="330" cy="35" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="350" cy="50" r="1.5" fill="#38bdf8" opacity="0.3"/>
  <circle cx="340" cy="75" r="1" fill="#6ee7b7" opacity="0.3"/>
</svg>
