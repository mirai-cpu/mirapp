<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="rG" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="#0f172a"/>
  <!-- Glow -->
  <circle cx="60" cy="70" r="40" fill="#fbbf24" opacity="0.06"/>
  <!-- Rays -->
  <g opacity="0.35">
    <line x1="60" y1="62" x2="32" y2="24" stroke="url(#rG)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="62" x2="20" y2="48" stroke="url(#rG)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="62" x2="60" y2="18" stroke="url(#rG)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="62" x2="88" y2="24" stroke="url(#rG)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="62" x2="100" y2="48" stroke="url(#rG)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Sun -->
  <circle cx="60" cy="74" r="26" fill="url(#sG)"/>
  <rect x="20" y="74" width="80" height="40" fill="#0f172a"/>
  <!-- Horizon -->
  <line x1="24" y1="74" x2="96" y2="74" stroke="url(#hG)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- S letter -->
  <text x="60" y="100" text-anchor="middle" font-family="'DM Sans', system-ui" font-size="18" font-weight="800" fill="#64748b" letter-spacing="0.05em">S</text>
</svg>
